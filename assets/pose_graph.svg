<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <!-- subtle grid -->
  <g stroke="#eef0f2" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
  </g>

  <!-- Raw drifted odometry path (dashed gray, spiraling outward, never closes) -->
  <path d="M 420 620
           L 480 500 L 470 460
           L 560 430 L 610 420
           L 650 340 L 700 320
           L 720 240 L 770 210
           L 760 160 L 800 130
           L 790 105 L 830 95"
        fill="none" stroke="#b8bec6" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Optimized trajectory (clean closed square loop) -->
  <path d="M 420 620
           L 420 260
           L 780 260
           L 780 620
           L 420 620"
        fill="none" stroke="#1b2a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Loop closure constraint (dashed red line linking start/end nodes) -->
  <line x1="420" y1="620" x2="830" y2="95" stroke="#c0453a" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Nodes along optimized trajectory -->
  <g fill="#1b2a4a">
    <circle cx="420" cy="620" r="8"/>
    <circle cx="420" cy="500" r="7"/>
    <circle cx="420" cy="380" r="7"/>
    <circle cx="420" cy="260" r="8"/>
    <circle cx="540" cy="260" r="7"/>
    <circle cx="660" cy="260" r="7"/>
    <circle cx="780" cy="260" r="8"/>
    <circle cx="780" cy="380" r="7"/>
    <circle cx="780" cy="500" r="7"/>
    <circle cx="780" cy="620" r="8"/>
    <circle cx="600" cy="620" r="7"/>
  </g>

  <!-- Nodes along raw odometry -->
  <g fill="#b8bec6">
    <circle cx="420" cy="620" r="6"/>
    <circle cx="480" cy="500" r="6"/>
    <circle cx="470" cy="460" r="6"/>
    <circle cx="560" cy="430" r="6"/>
    <circle cx="610" cy="420" r="6"/>
    <circle cx="650" cy="340" r="6"/>
    <circle cx="700" cy="320" r="6"/>
    <circle cx="720" cy="240" r="6"/>
    <circle cx="770" cy="210" r="6"/>
    <circle cx="760" cy="160" r="6"/>
    <circle cx="800" cy="130" r="6"/>
    <circle cx="790" cy="105" r="6"/>
    <circle cx="830" cy="95" r="6"/>
  </g>

  <!-- Legend -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1b2a4a">
    <line x1="90" y1="90" x2="140" y2="90" stroke="#b8bec6" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="152" y="98">Raw odometry (drift)</text>

    <line x1="90" y1="130" x2="140" y2="130" stroke="#1b2a4a" stroke-width="4"/>
    <text x="152" y="138">Optimized trajectory</text>
  </g>
</svg>
